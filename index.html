
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101c32">
<title>Vroumigo - Autos à vendre</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f9;color:#182238;font-family:Arial,sans-serif}
header{background:#101c32;color:white;padding:22px 18px}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:29px;font-weight:900;color:#ffb52e}
.logo span{color:white}
button{cursor:pointer;border:0;border-radius:10px;padding:12px 16px;font-weight:bold}
.lang{background:#263750;color:white}
.hero{padding:27px 18px;background:#172c49;color:white}
.hero h1{font-size:29px;margin:0 0 12px}
.hero p{color:#cbd6e5}
.search{display:flex;gap:8px;margin-top:20px}
input,select{width:100%;padding:14px;border:1px solid #d8deea;border-radius:10px;background:white;font-size:15px}
.search button,.add{background:#ffb52e;color:#172238}
main{padding:18px;max-width:950px;margin:auto}
h2{font-size:21px}
.filters{display:flex;gap:9px;margin-bottom:20px}
.filters>*{min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.car{background:white;border-radius:15px;overflow:hidden;box-shadow:0 3px 12px #14223a12}
.car img{width:100%;height:165px;object-fit:cover;background:#ddd}
.info{padding:14px}
.info h3{margin:0 0 8px}
.price{font-size:22px;color:#147b53;font-weight:bold}
.details{color:#657187;font-size:14px;margin:9px 0}
.tag{background:#eaf4ee;color:#147b53;padding:5px 8px;border-radius:6px;font-size:12px}
.empty{padding:30px;text-align:center;color:#667}
.panel{background:white;padding:17px;border-radius:14px;margin:24px 0}
.panel input,.panel select{margin:7px 0 12px}
footer{text-align:center;padding:25px;color:#718096;font-size:13px}
.add{width:100%;font-size:16px}
#message{color:#147b53}
@media(max-width:480px){.search{flex-direction:column}.filters{flex-direction:column}}
</style>
</head>
<body>
<header>
 <div class="top">
  <div class="logo">🚗 Vroumi<span>go</span></div>
  <button class="lang" onclick="toggleLang()" id="lang">EN</button>
 </div>
</header>

<section class="hero">
 <h1 id="title">Trouvez votre prochaine voiture!</h1>
 <p id="subtitle">Des voitures à vendre chez les garages et les particuliers.</p>
 <div class="search">
  <input id="search" placeholder="Marque, modèle..." oninput="render()">
  <button onclick="render()" id="searchBtn">Rechercher</button>
 </div>
</section>

<main>
 <h2 id="recent">🚘 Voitures à vendre</h2>
 <div class="filters">
  <select id="brand" onchange="render()">
   <option value="">Toutes les marques</option>
   <option>Toyota</option><option>Honda</option>
   <option>Ford</option><option>BMW</option>
   <option>Mercedes</option><option>Hyundai</option>
   <option>Chevrolet</option>
  </select>
  <select id="sort" onchange="render()">
   <option value="">Trier par prix</option>
   <option value="asc">Prix croissant</option>
   <option value="desc">Prix décroissant</option>
  </select>
 </div>

 <div class="grid" id="cars"></div>

 <section class="panel">
  <h2 id="addTitle">➕ Ajouter une voiture à vendre</h2>
  <form id="form">
   <input id="make" placeholder="Marque" required>
   <input id="model" placeholder="Modèle et année" required>
   <input id="price" type="number" placeholder="Prix en dollars" required>
   <input id="km" type="number" placeholder="Kilométrage" required>
   <input id="city" placeholder="Ville" required>
   <input id="photo" type="url" placeholder="Lien de la photo (facultatif)">
   <button class="add" type="submit" id="publish">Publier mon annonce</button>
  </form>
  <p id="message"></p>
 </section>
</main>

<footer>Vroumigo © 2026 - Le marché automobile</footer>

<script>
let english=false;

const initial=[
 {make:"Toyota",model:"Corolla 2022",price:21900,km:32000,city:"Québec",photo:"https://images.unsplash.com/photo-1621007947382-bb3c3994e3fb?w=700"},
 {make:"Honda",model:"Civic 2021",price:19500,km:45000,city:"Montréal",photo:"https://images.unsplash.com/photo-1594070319944-7c0cbebb6f58?w=700"},
 {make:"BMW",model:"Série 3 2023",price:38900,km:18000,city:"Lévis",photo:"https://images.unsplash.com/photo-1555215695-3004980ad54e?w=700"},
 {make:"Ford",model:"Mustang 2020",price:34900,km:51000,city:"Ottawa",photo:"https://images.unsplash.com/photo-1584345604476-8ec5e12e42dd?w=700"}
];

let cars=JSON.parse(localStorage.getItem("vroumigoCars")||"null")||initial;

function save(){
 localStorage.setItem("vroumigoCars",JSON.stringify(cars));
}

function render(){
 let q=document.getElementById("search").value.toLowerCase();
 let b=document.getElementById("brand").value;
 let s=document.getElementById("sort").value;
 let list=cars.filter(c=>
 (c.make+" "+c.model+" "+c.city).toLowerCase().includes(q)&&
 (!b||c.make.toLowerCase()===b.toLowerCase())
 );
 if(s==="asc")list.sort((a,b)=>a.price-b.price);
 if(s==="desc")list.sort((a,b)=>b.price-a.price);

 document.getElementById("cars").innerHTML=list.length?list.map(c=>`
 <article class="car">
 <img src="${safe(c.photo)}" alt="Voiture" onerror="this.src='https://placehold.co/600x350?text=Vroumigo'">
 <div class="info">
 <span class="tag">À vendre</span>
 <h3>${safe(c.make)} ${safe(c.model)}</h3>
 <div class="price">${Number(c.price).toLocaleString("fr-CA")} $</div>
 <div class="details">📍 ${safe(c.city)}<br>🛣️ ${Number(c.km).toLocaleString("fr-CA")} km</div>
 </div>
 </article>`).join(""):`<div class="empty">Aucune voiture trouvée.</div>`;
}

function safe(value){
 return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

document.getElementById("form").addEventListener("submit",function(e){
 e.preventDefault();
 cars.unshift({
 make:document.getElementById("make").value,
 model:document.getElementById("model").value,
 price:Number(document.getElementById("price").value),
 km:Number(document.getElementById("km").value),
 city:document.getElementById("city").value,
 photo:document.getElementById("photo").value||"https://placehold.co/600x350?text=Vroumigo"
 });
 save();
 render();
 this.reset();
 document.getElementById("message").textContent=english?"Listing added on this device!":"Annonce ajoutée sur cet appareil!";
});

function toggleLang(){
 english=!english;
 document.getElementById("lang").textContent=english?"FR":"EN";
 document.getElementById("title").textContent=english?"Find your next car!":"Trouvez votre prochaine voiture!";
 document.getElementById("subtitle").textContent=english?"Cars for sale from dealers and private sellers.":"Des voitures à vendre chez les garages et les particuliers.";
 document.getElementById("recent").textContent=english?"🚘 Cars for sale":"🚘 Voitures à vendre";
 document.getElementById("addTitle").textContent=english?"➕ Add a car for sale":"➕ Ajouter une voiture à vendre";
 document.getElementById("publish").textContent=english?"Publish my listing":"Publier mon annonce";
 document.getElementById("search").placeholder=english?"Make, model...":"Marque, modèle...";
 document.getElementById("searchBtn").textContent=english?"Search":"Rechercher";
 render();
}

render();
</script>
</body>
</html>
